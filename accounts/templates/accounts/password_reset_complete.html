{% extends 'base.html' %} <br />

{% block title %}Password Reset Complete - Church CMS{% endblock %} <br />

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card shadow">
      <div class="card-header bg-success text-white">
        <h4 class="mb-0">
          <i class="fas fa-check-circle"></i> Password Reset Complete
        </h4>
      </div>
      <div class="card-body text-center">
        <div class="mb-4">
          <i class="fas fa-check-circle fa-5x text-success"></i>
        </div>

        <h4 class="text-success">Success!</h4>
        <p class="lead">
          Your password has been set. You may go ahead and log in now.
        </p>

        <div class="mt-4">
          <a href="{% url 'accounts:login' %}" class="btn btn-success btn-lg">
            <i class="fas fa-sign-in-alt"></i> Log In Now
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

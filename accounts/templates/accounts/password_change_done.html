{% extends 'base.html' %} {% block title %}Password Changed - Church CMS{%
endblock %} {% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card shadow">
      <div class="card-header bg-success text-white">
        <h4 class="mb-0">
          <i class="fas fa-check-circle"></i> Password Changed
        </h4>
      </div>
      <div class="card-body text-center">
        <div class="mb-4">
          <i class="fas fa-check-circle fa-5x text-success"></i>
        </div>

        <h4 class="text-success">Success!</h4>
        <p class="lead">Your password has been changed successfully.</p>

        <div class="mt-4">
          <a
            href="{% url 'accounts:profile' %}"
            class="btn btn-outline-primary"
          >
            <i class="fas fa-user"></i> Back to Profile
          </a>
          <a href="{% url 'dashboard:member' %}" class="btn btn-primary">
            <i class="fas fa-tachometer-alt"></i> Go to Dashboard
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

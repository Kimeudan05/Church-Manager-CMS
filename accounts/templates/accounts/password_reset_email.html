<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Password Reset</title>
</head>
<body>
  <p>Hello {{ user.get_username }},</p>
  <p>You're receiving this email because you requested a password reset for your Church CMS account.</p>
  <p>Please click the link below to choose a new password:</p>
  <p>
    <a href="{{ protocol }}://{{ domain }}{% url 'accounts:password_reset_confirm' uidb64=uid token=token %}">
      Reset Password
    </a>
  </p>
  <p>If you didn't request this, you can safely ignore this email.</p>
  <p>Thanks,<br/>The Church CMS Team</p>
</body>
</html>

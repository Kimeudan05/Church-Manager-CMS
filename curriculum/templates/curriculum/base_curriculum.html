{% extends 'base.html' %}
{% load static %}

{% block extra_css %}
<style>
    .curriculum-card {
        transition: transform 0.2s;
    }
    .curriculum-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    .lesson-progress {
        height: 20px;
        border-radius: 10px;
    }
    .status-badge {
        font-size: 0.75rem;
    }
    .lesson-card {
        border-left: 4px solid #007bff;
    }
    .completed-lesson {
        border-left-color: #28a745;
    }
    .upcoming-lesson {
        border-left-color: #ffc107;
    }
    .difficulty-badge {
        font-size: 0.7rem;
    }
    .file-attachment {
        border: 1px solid #dee2e6;
        border-radius: 5px;
        padding: 10px;
        margin-bottom: 10px;
    }
    .attendance-present {
        color: #28a745;
        background-color: rgba(40, 167, 69, 0.1);
    }
    .attendance-absent {
        color: #dc3545;
        background-color: rgba(220, 53, 69, 0.1);
    }
</style>
{% endblock %}

{% block breadcrumbs %}
<nav aria-label="breadcrumb">
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="{% url 'dashboard:index' %}">Dashboard</a></li>
        <li class="breadcrumb-item"><a href="{% url 'curriculum:list' %}">Curriculums</a></li>
        {% block curriculum_breadcrumbs %}{% endblock %}
    </ol>
</nav>
{% endblock %}
